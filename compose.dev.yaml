name: bot-finance-dev

x-app-image: &app-image
  build:
    context: .
    target: runtime
  image: bot-finance-dev:${IMAGE_TAG:-local}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  db-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatoria}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate-dev:
    <<: *app-image
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
    depends_on:
      db-dev:
        condition: service_healthy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api-dev:
    <<: *app-image
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
      API_URL: http://api-dev:8000
      GROQ: ${GROQ:?GROQ obrigatoria}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      MINHAS_ECONOMIAS_CLIENT_ID: ${MINHAS_ECONOMIAS_CLIENT_ID:-}
      MINHAS_ECONOMIAS_REDIRECT_URI: ${MINHAS_ECONOMIAS_REDIRECT_URI:-}
      MINHAS_ECONOMIAS_MCP_URL: ${MINHAS_ECONOMIAS_MCP_URL:-}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db-dev:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  bot-dev:
    <<: *app-image
    profiles: ["bot"]
    command: ["python", "services/bot_telegram.py"]
    environment:
      TELEGRAM: ${TELEGRAM_DEV:-}
      API_URL: http://api-dev:8000
    depends_on:
      api-dev:
        condition: service_healthy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_dev_data: